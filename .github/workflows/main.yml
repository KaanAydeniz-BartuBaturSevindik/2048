name: Deploy 2048 to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Needed so the workflow can push the built site to the gh-pages branch
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Emscripten version must match the version Qt for WebAssembly was built with.
      # Qt 6.8.x targets Emscripten 3.1.56 (see https://doc.qt.io/qt-6/wasm.html).
      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.56
          actions-cache-folder: emsdk-cache

      # Installs Qt for WebAssembly (the required desktop Qt host tools are
      # installed automatically by this action). "wasm_singlethread" is used
      # because GitHub Pages does not send the COOP/COEP headers required
      # for multithreaded WASM.
      - name: Install Qt for WebAssembly
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: 'all_os'
          target: 'wasm'
          arch: 'wasm_singlethread'
          cache: true

      - name: Configure (qt-cmake)
        run: |
          "${QT_ROOT_DIR}/bin/qt-cmake" -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Prepare GitHub Pages site
        run: |
          set -e
          mkdir -p site
          cp build/2048.html site/index.html
          cp build/2048.js site/
          cp build/2048.wasm site/
          # These files may or may not be generated depending on the Qt version;
          # copy them if present, but don't fail the build if they aren't.
          cp build/qtloader.js site/ 2>/dev/null || true
          cp build/qtlogo.svg site/ 2>/dev/null || true
          cp build/2048.data site/ 2>/dev/null || true
          # Tell GitHub Pages not to run Jekyll processing on the output.
          touch site/.nojekyll

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
