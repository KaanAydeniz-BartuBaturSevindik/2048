name: Qt WebAssembly Build and Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Emscripten (WASM Compiler)
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: '3.1.25'

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.5.3'
          target: 'desktop'
          architecture: 'wasm_singlethread'
          cache: 'true'

      - name: Build Project
        run: |
          mkdir build
          cd build
          qt-cmake -DCMAKE_TOOLCHAIN_FILE=$QT_PATH/lib/cmake/Qt6/qt.toolchain.cmake ..
          cmake --build .

      - name: Prepare Files for Deployment
        run: |
          mkdir -p public
          echo "==== INSIDE BUILD DIRECTORY ===="
          ls -laR build/
          echo "================================"
          find build -type f -name "*.wasm" -exec cp {} public/ \;
          find build -type f -name "*.js" -exec cp {} public/ \;
          HTML_FILE=$(find build -type f -name "*.html" | head -n 1)
          if [ -n "$HTML_FILE" ]; then
            cp "$HTML_FILE" public/index.html
          fi

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          force_orphan: true
